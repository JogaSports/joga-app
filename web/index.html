<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving the web app at a path other than the root, change the
    href value below, or pass --base-href to `flutter build web`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Joga Sports: find, book and play organised football across Wales, with stats, streaks and rewards.">
  <meta name="theme-color" content="#090A09">

  <!-- Link previews (WhatsApp, iMessage, email) -->
  <meta property="og:title" content="Joga Sports · Interactive demo">
  <meta property="og:description" content="Find, book and play organised football across Wales, with stats, streaks and rewards.">
  <meta property="og:type" content="website">

  <!-- iOS "Add to Home Screen" -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Joga">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Joga Sports</title>

  <!-- Branded splash while Flutter loads, removed on the first frame. -->
  <style>
    html, body { margin: 0; height: 100%; background: #090A09; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 28px;
      background: radial-gradient(circle at 50% 30%, rgba(198,241,53,.10), transparent 60%), #090A09;
      transition: opacity .3s ease;
    }
    #splash img { width: 88px; height: 88px; border-radius: 22px; }
    #splash .bar { width: 120px; height: 3px; border-radius: 3px; background: #1E2224; overflow: hidden; }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%; background: #C6F135;
      border-radius: 3px; animation: load 1.1s ease-in-out infinite;
    }
    @keyframes load { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #splash .bar::after { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <div id="splash" aria-label="Loading Joga Sports" role="progressbar">
    <img src="icons/Icon-192.png" alt="">
    <div class="bar"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.style.opacity = '0';
      setTimeout(function () { splash.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
